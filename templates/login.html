<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Sign-to-Text Assistant</title>
  <link rel="stylesheet" href="/static/auth.css" />
</head>
<body>

  <div class="auth-card">

    <!-- Brand -->
    <div class="auth-brand">
      <span class="auth-brand-icon" aria-hidden="true">🤟</span>
      <span class="auth-brand-name">Sign-to-Text Assistant</span>
    </div>

    <!-- Heading -->
    <div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to continue to your dashboard.</p>
    </div>

    <!-- Error / success message (hidden until JS sets a class) -->
    <p id="authMessage" class="auth-message" role="alert" aria-live="polite"></p>

    <!-- Login form -->
    <form id="loginForm" class="auth-form" novalidate>

      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input id="email"
               class="form-input"
               type="email"
               autocomplete="email"
               placeholder="you@example.com"
               required />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input id="password"
               class="form-input"
               type="password"
               autocomplete="current-password"
               placeholder="Your password"
               required />
      </div>

      <button id="submitBtn" class="btn-auth" type="submit">
        Sign In
      </button>

    </form>

    <!-- Link to registration page -->
    <p class="auth-footer">
      Don't have an account?
      <a href="/register">Create one</a>
    </p>

  </div>

  <!--
    Firebase Authentication — loaded as ES modules from the CDN.
    type="module" is required so that import/export statements work in the
    browser without a build step.
  -->
  <script type="module">
    import { signIn, authErrorMessage } from "/static/auth.js";

    const form       = document.getElementById("loginForm");
    const submitBtn  = document.getElementById("submitBtn");
    const msgEl      = document.getElementById("authMessage");

    // Helper: show a styled message above the button
    function showMessage(text, type) {   // type: "error" | "success"
      msgEl.textContent = text;
      msgEl.className   = `auth-message ${type}`;
    }

    function clearMessage() {
      msgEl.textContent = "";
      msgEl.className   = "auth-message";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMessage();

      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showMessage("Please enter your email and password.", "error");
        return;
      }

      submitBtn.disabled    = true;
      submitBtn.textContent = "Signing in…";

      try {
        await signIn(email, password);
        // signIn succeeded — redirect to the main dashboard
        window.location.href = "/";
      } catch (err) {
        showMessage(authErrorMessage(err), "error");
        submitBtn.disabled    = false;
        submitBtn.textContent = "Sign In";
      }
    });
  </script>

</body>
</html>
