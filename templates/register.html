<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Sign-to-Text Assistant</title>
  <link rel="stylesheet" href="/static/auth.css" />
</head>
<body>

  <div class="auth-card">

    <!-- Brand -->
    <div class="auth-brand">
      <span class="auth-brand-icon" aria-hidden="true">🤟</span>
      <span class="auth-brand-name">Sign-to-Text Assistant</span>
    </div>

    <!-- Heading -->
    <div>
      <h1 class="auth-title">Create an account</h1>
      <p class="auth-subtitle">Register to start translating gestures.</p>
    </div>

    <!-- Error / success message (hidden until JS sets a class) -->
    <p id="authMessage" class="auth-message" role="alert" aria-live="polite"></p>

    <!-- Registration form -->
    <form id="registerForm" class="auth-form" novalidate>

      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input id="email"
               class="form-input"
               type="email"
               autocomplete="email"
               placeholder="you@example.com"
               required />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input id="password"
               class="form-input"
               type="password"
               autocomplete="new-password"
               placeholder="At least 6 characters"
               required
               minlength="6" />
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword"
               class="form-input"
               type="password"
               autocomplete="new-password"
               placeholder="Repeat your password"
               required />
      </div>

      <button id="submitBtn" class="btn-auth" type="submit">
        Create Account
      </button>

    </form>

    <!-- Link back to login -->
    <p class="auth-footer">
      Already have an account?
      <a href="/login">Sign in</a>
    </p>

  </div>

  <!--
    Firebase Authentication — loaded as ES modules from the CDN.
    type="module" is required so that import/export statements work in the
    browser without a build step.
  -->
  <script type="module">
    import { register, authErrorMessage } from "/static/auth.js";

    const form    = document.getElementById("registerForm");
    const submitBtn = document.getElementById("submitBtn");
    const msgEl   = document.getElementById("authMessage");

    function showMessage(text, type) {   // type: "error" | "success"
      msgEl.textContent = text;
      msgEl.className   = `auth-message ${type}`;
    }

    function clearMessage() {
      msgEl.textContent = "";
      msgEl.className   = "auth-message";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMessage();

      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirm  = document.getElementById("confirmPassword").value;

      // Client-side validation before hitting Firebase
      if (!email || !password || !confirm) {
        showMessage("Please fill in all fields.", "error");
        return;
      }

      if (password.length < 6) {
        showMessage("Password must be at least 6 characters.", "error");
        return;
      }

      if (password !== confirm) {
        showMessage("Passwords do not match.", "error");
        return;
      }

      submitBtn.disabled    = true;
      submitBtn.textContent = "Creating account…";

      try {
        await register(email, password);
        // Account created — redirect straight to the dashboard
        // Firebase automatically signs the user in after registration.
        showMessage("Account created! Redirecting…", "success");
        setTimeout(() => { window.location.href = "/"; }, 1000);
      } catch (err) {
        showMessage(authErrorMessage(err), "error");
        submitBtn.disabled    = false;
        submitBtn.textContent = "Create Account";
      }
    });
  </script>

</body>
</html>
